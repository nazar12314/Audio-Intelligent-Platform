exclude: ^(migrations/|agent-guides/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        exclude: ^(poetry\.lock|src/audio_platform/modules/processing/adapters/silero/silero_vad_16k\.onnx)$
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3 # must match the ruff version in pyproject.toml
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/python-poetry/poetry
    rev: 2.4.1 # must match the Poetry version in the Dockerfile and CI
    hooks:
      - id: poetry-check
        args: [--lock]
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.4
    hooks:
      - id: terraform_fmt
      # validate, tflint and checkov run via Docker in `make tf-lint` and CI: no local installs needed.
