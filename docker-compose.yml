# Local development stack. All credentials here are development-only.

x-dev-s3:
  access-key: &dev-s3-access-key rustfs-dev
  secret-key: &dev-s3-secret-key rustfs-dev-secret

x-app: &app
  build: { context: ., dockerfile: docker/app/Dockerfile }
  env_file: .env
  # Container-network overrides for the host-oriented values in .env.
  environment:
    AUDIO_POSTGRES__DSN: postgresql+asyncpg://app:app@postgres:5432/audio_platform
    AUDIO_AWS__ENDPOINT_URL: http://rustfs:9000
    AUDIO_AWS__S3_ADDRESSING_STYLE: path
    AUDIO_STORAGE__PUBLIC_ENDPOINT_URL: http://localhost:${S3_HOST_PORT:-9000}
    AWS_ACCESS_KEY_ID: *dev-s3-access-key
    AWS_SECRET_ACCESS_KEY: *dev-s3-secret-key
  restart: unless-stopped
  networks: [backend]

services:
  app:
    <<: *app
    command: ["audio-platform-api"]
    ports: ["${APP_HOST_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }

  migrate: # one-shot schema migration
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  # ── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:18.6-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: audio_platform }
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql] # PostgreSQL 18+ images keep PGDATA under a versioned subfolder
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app -d audio_platform"], interval: 5s, timeout: 3s, retries: 10 }
    networks: [backend]

  rustfs: # S3-compatible object storage, stands in for Amazon S3 (see docs/adr/0002)
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: *dev-s3-access-key
      RUSTFS_SECRET_KEY: *dev-s3-secret-key
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "${S3_HOST_PORT:-9000}:9000" # S3 API: host runs and presigned URLs
      - "${S3_CONSOLE_HOST_PORT:-9001}:9001" # web console, dev only
    volumes: [rustfs_data:/data]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"], interval: 5s, timeout: 3s, retries: 10 }
    networks: [backend]

  s3-init: # one-shot: bucket + browser CORS (on AWS both come from Terraform)
    image: amazon/aws-cli:2.39.3
    environment:
      AWS_ACCESS_KEY_ID: *dev-s3-access-key
      AWS_SECRET_ACCESS_KEY: *dev-s3-secret-key
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000
      BUCKET: ${AUDIO_STORAGE__BUCKET:?set AUDIO_STORAGE__BUCKET in .env}
      CORS: >-
        {"CORSRules": [{"AllowedOrigins": ["http://localhost:5173"],
        "AllowedMethods": ["PUT", "GET", "HEAD"], "AllowedHeaders": ["*"],
        "ExposeHeaders": ["ETag"], "MaxAgeSeconds": 3000}]}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        (aws s3api head-bucket --bucket "$$BUCKET" 2>/dev/null
        || aws s3api create-bucket --bucket "$$BUCKET")
        && aws s3api put-bucket-cors --bucket "$$BUCKET" --cors-configuration "$$CORS"
    restart: "no"
    depends_on:
      rustfs: { condition: service_healthy }
    networks: [backend]

volumes:
  postgres_data: {}
  rustfs_data: {}

networks:
  backend: {}
