include classpath("application.conf")

# "*" builds queue URLs from each request's Host header, so containers (elasticmq:9324)
# and the host (localhost:9324) both get URLs they can reach.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

# maxReceiveCount stays above AUDIO_MESSAGING__MAX_ATTEMPTS (3): the last attempt
# records the failure itself, the DLQ only catches messages that crash consumers.
queues {
  audio-platform-dev-pipeline-events-dlq {}
  audio-platform-dev-pipeline-events {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "audio-platform-dev-pipeline-events-dlq"
      maxReceiveCount = 5
    }
  }
  audio-platform-dev-vad-tasks-dlq {}
  audio-platform-dev-vad-tasks {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "audio-platform-dev-vad-tasks-dlq"
      maxReceiveCount = 5
    }
  }
}
